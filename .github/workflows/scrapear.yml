name: Indexar fuentes

# cron va en UTC: 06:00 UTC ≈ 01:00 Perú.
on:
  schedule:
    - cron: '0 6 * * 1-6' # capítulos, de lunes a sábado
    - cron: '0 5 * * 0'   # domingo: además, catálogo completo de cada sitio
  workflow_dispatch: # botón manual en la pestaña Actions
    inputs:
      descubrir:
        description: 'Recorrer también el catálogo de cada sitio'
        type: boolean
        default: false
      obra:
        description: 'Scrapear SOLO esta obra (slug), p.ej. return-of-the-mount-hua'
        type: string
        default: ''
      max:
        description: 'Cuántas fuentes atender en la corrida'
        type: string
        default: '4000'

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Obras nuevas de cada sitio. Los domingos (y a mano) porque un catálogo
      # no cambia a diario, y recorrerlo son cientos de peticiones a sitios ajenos.
      - name: Descubrir obras
        if: github.event.schedule == '0 5 * * 0' || github.event.inputs.descubrir == 'true'
        run: node scripts/descubrir.mjs
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Capítulos nuevos. --max acota la corrida: las fuentes se atienden por
      # antigüedad (las nunca vistas primero), así que lo que no entra hoy entra
      # mañana. A mano se puede subir --max para vaciar el backlog, o pasar
      # --obra=<slug> para priorizar una obra concreta.
      - name: Indexar capítulos
        run: node scripts/scrapear.mjs --max=${{ github.event.inputs.max || '4000' }} ${{ github.event.inputs.obra && format('--obra={0}', github.event.inputs.obra) || '' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Cloudflare Pages reconstruye el sitio estático con lo nuevo ya aprobado.
      - run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
        if: success()
