name: Indexar fuentes

# cron va en UTC: 06:00 UTC ≈ 01:00 Perú.
on:
  schedule:
    - cron: '0 6 * * 1-6' # capítulos, de lunes a sábado
    - cron: '0 5 * * 0'   # domingo: además, catálogo completo de cada sitio
  workflow_dispatch: # botón manual en la pestaña Actions
    inputs:
      descubrir:
        description: 'Recorrer también el catálogo de cada sitio'
        type: boolean
        default: false
      obra:
        description: 'Scrapear SOLO esta obra (slug), p.ej. return-of-the-mount-hua'
        type: string
        default: ''
      max:
        description: 'Cuántas fuentes atender en la corrida'
        type: string
        default: '4000'

permissions:
  contents: write # subir el snapshot al release

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Obras nuevas de cada sitio. A DIARIO pero solo las primeras 3 páginas de
      # cada catálogo (--paginas=3): van ordenados por "más reciente", así que un
      # título nuevo cae ahí, y así el barrido diario es ~20× más barato en
      # peticiones a sitios ajenos. El domingo (y a mano) sí se recorre entero,
      # por si algún título nuevo entró más adentro del listado.
      - name: Descubrir obras
        if: github.event_name == 'schedule' || github.event.inputs.descubrir == 'true'
        run: node scripts/descubrir.mjs ${{ github.event.schedule == '0 6 * * 1-6' && '--paginas=3' || '' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Capítulos nuevos. Con la cortesía por dominio (y los link-out sin espera)
      # las fuentes entran en lotes manejables. --max es el tope por corrida.
      # A mano se puede pasar --obra=<slug> para priorizar una obra concreta.
      - name: Indexar capítulos
        run: node scripts/scrapear.mjs --max=${{ github.event.inputs.max || '4000' }} ${{ github.event.inputs.obra && format('--obra={0}', github.event.inputs.obra) || '' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Metadata (sinopsis, títulos alternos, géneros) desde AniList/MangaUpdates/
      # MangaBaka/MAL. Cada obra se enriquece una vez; solo entran las nuevas.
      - name: Enriquecer metadatos
        run: node scripts/enriquecer.mjs --max=150 ${{ github.event.inputs.obra && format('--obra={0}', github.event.inputs.obra) || '' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Segunda pasada sobre las obras que se enriquecieron pero no casaron con
      # ninguna ficha. Tope bajo: cada obra son ~4 s de cortesía repartida.
      - name: Reintentar las obras sin ficha
        run: node scripts/enriquecer.mjs --reintentar --max=50
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Snapshot incremental de capitulos_externos para el build: Supabase solo
      # entrega lo que cambió desde la última vez (ver scripts/snapshot.mjs).
      - name: Snapshot de capítulos
        run: |
          gh release download snapshot -p capitulos.json.br || echo "sin snapshot previo: va completo"
          node scripts/snapshot.mjs
          gh release view snapshot >/dev/null 2>&1 || gh release create snapshot --title snapshot --notes "Datos del build. Lo reescribe scripts/snapshot.mjs; no borrar."
          gh release upload snapshot capitulos.json.br --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Cloudflare Pages reconstruye el sitio estático con lo nuevo ya aprobado.
      - run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
        if: success()

      # IndexNow: un POST y Bing, Yandex, Naver y Seznam saben qué URLs tocar.
      # Solo las obras que recibieron capítulo nuevo de la corrida nocturna — mandar el catálogo
      # entero en cada corrida es ruido. Google no participa en IndexNow: ahí
      # trabajan el sitemap y los enlaces internos.
      - name: Avisar a los buscadores (IndexNow)
        if: success()
        continue-on-error: true # que un 5xx suyo no marque en rojo la indexación
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
